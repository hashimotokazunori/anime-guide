<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コナン特集</title>
<meta name="description" content="名探偵コナンの人物相関図、TVアニメ全話リスト、劇場版の歴代タイトルをまとめた特集。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 中央に主人公、周りに勢力ごとの枠。選んだ人物から関係する人物へ線を引く。アニメ帖と同じ夜色の一色の世界観。 */
:root{
  color-scheme:dark;
  --night:#0B0716; --night2:#1A0E2E; --panel:rgba(22,13,40,.86); --line:rgba(255,120,200,.26);
  --ink:#F6EEFA; --muted:#B9A8C9; --pink:#FF3EA5; --pink-soft:#FF8CCB; --gold:#FFB21E; --spoil:#9A6BFF;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
html{background:var(--night)}
body{background:radial-gradient(ellipse 70% 50% at 80% 0%,rgba(255,62,165,.18),transparent 70%),radial-gradient(ellipse 60% 50% at 0% 100%,rgba(120,60,255,.18),transparent 70%),var(--night);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6;min-height:100%}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pink-soft);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,48px);line-height:1.1;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:700;color:var(--pink-soft);letter-spacing:.14em;margin-bottom:6px}
.lede{margin:6px 0 0;color:var(--muted);max-width:56ch}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}
.toggle[aria-pressed="true"]{background:linear-gradient(180deg,#7B4BFF,#5524D6);border-color:var(--spoil);box-shadow:0 0 14px rgba(154,107,255,.5)}
.toggle .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.toggle[aria-pressed="true"] .dot{background:#fff}

/* 選択中の人物 */
.focus{position:relative;z-index:5;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:grid;gap:6px}
.focus h2{margin:0;font-size:18px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.focus h2 .grp{font-size:11px;font-weight:700;color:var(--night);border-radius:3px;padding:1px 7px}
.focus p{margin:0;color:#E3D6EE}
.rels{display:flex;flex-wrap:wrap;gap:6px}
.rel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:2px 10px 2px 4px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.rel b{background:rgba(255,255,255,.12);border-radius:999px;padding:0 8px}
.rel:hover{border-color:var(--pink)}
.rel.sp{border-color:rgba(154,107,255,.6)}
.secret{color:#D9C8FF}
.secret::before{content:"ネタバレ ";font-size:10px;font-weight:800;color:var(--spoil);letter-spacing:.06em}

/* 相関図 */
.board{position:relative}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative;z-index:1}
.group{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);border-top:3px solid var(--c);border-radius:12px;padding:10px;min-width:0}
.group h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--c);display:flex;justify-content:space-between}
.group h3 .gh{display:inline-flex;align-items:center;gap:6px}
.ic{flex:none;vertical-align:-2px}
.group.center{border-color:rgba(255,62,165,.4);border-top-color:var(--pink);background:rgba(255,62,165,.06)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.p{position:relative;z-index:3;background:#1B1030;border:1px solid rgba(255,255,255,.14);border-left:3px solid var(--c);border-radius:8px;padding:6px 10px;text-align:left;display:grid;gap:0;min-width:0;max-width:100%}
.p .n{font-weight:700;font-size:14px;line-height:1.3}
.p .r{font-size:10.5px;color:var(--muted);line-height:1.35}
.p:hover{border-color:var(--pink-soft)}
.p.sel{background:linear-gradient(180deg,var(--pink),#C21E7E);border-color:var(--pink);box-shadow:0 0 18px rgba(255,62,165,.6)}
.p.sel .r{color:#FFE3F1}
.p.rel-on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.board.dim .p:not(.sel):not(.rel-on){opacity:.42}
.p .alias{display:block;font-size:10px;color:#D9C8FF}

.lnk{stroke:var(--gold);stroke-width:1.6;fill:none;opacity:.85}
.lnk.sp{stroke:var(--spoil);stroke-dasharray:5 4}
.lbl rect{fill:#120A22;stroke:rgba(255,178,30,.6)}
.lbl.sp rect{stroke:rgba(154,107,255,.8)}
.lbl text{fill:#FFE7B8;font-size:11px;font-family:var(--body);font-weight:700}
.lbl.sp text{fill:#E3D6FF}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--gold)}
.legend i.sp{border-top:2px dashed var(--spoil)}
footer{margin-top:22px;font-size:12px;color:var(--muted)}

/* 重要エピソード */
.episodes{margin-top:40px}
.eplist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ep{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 12px}
.ep:target{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.epno{font-family:var(--display);color:var(--pink-soft);font-size:15px;font-variant-numeric:tabular-nums}
.eptt{font-weight:700;overflow-wrap:anywhere}
.epmeta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.keytag{font-size:10px;font-weight:800;color:#2A1300;background:var(--gold);border-radius:3px;padding:0 6px}
.epwho{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px}
.who{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;font-size:11px;padding:0 9px}
.who:hover{border-color:var(--pink)}
.eprel{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px}
.eprl{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--gold)}
.eprel a{color:#FFE7B8;text-decoration:none;border-bottom:1px dotted rgba(255,231,184,.5)}
@media (max-width:560px){.ep{grid-template-columns:60px minmax(0,1fr)}.epmeta{grid-column:2}}

/* 全話リスト */
.allep{margin-top:40px}
.aebar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.aebar input,.aebar select{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.16);border-radius:8px;color:var(--ink);font:inherit;padding:8px 12px}
.aebar input{flex:1 1 240px;min-width:0}
.aelist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 12px}
.ae{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
.ae .no{font-variant-numeric:tabular-nums;color:var(--pink-soft);font-weight:700;font-size:13px}
.ae .t{overflow-wrap:anywhere}
.ae .d{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ae.key .t::after{content:"重要";font-size:9px;font-weight:800;color:#2A1300;background:var(--gold);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:2px}
.ae a{color:inherit;text-decoration:none}
.aemore{margin:12px auto 0;display:flex}

/* 劇場版一覧 */
.movies{margin-top:40px}
.mvhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;margin-bottom:12px}
.mvhead h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,3.4vw,30px);margin:0}
.mvhead .lede{margin:0}
.mvlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.mv{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 12px 8px 8px;min-width:0}
.mv .no{font-family:var(--display);font-size:24px;line-height:1;text-align:center;color:var(--pink-soft);font-variant-numeric:tabular-nums}
.mv .no small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);font-weight:700;margin-top:2px}
.mv .tt{font-weight:700;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
.mv .yr{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mv .yr a{color:var(--gold);text-decoration:none;font-weight:700}
.mv .yr a.ytlink{color:#FF6B6B}
.mv.latest{border-color:var(--pink);background:rgba(255,62,165,.1)}
.mv.latest .yr::before{content:"最新作";font-size:10px;font-weight:800;color:#fff;background:var(--pink);border-radius:3px;padding:0 6px}

@media (max-width:860px){
  .grid{grid-template-columns:1fr}
  #lines{display:none}
  .focus{position:sticky;top:env(safe-area-inset-top,0px);max-height:42vh;overflow-y:auto}
  .board.dim .p:not(.sel):not(.rel-on){opacity:1}
}
@media (prefers-reduced-motion:no-preference){.p{transition:opacity .15s,box-shadow .15s,background .15s}}

/* ページ間のメニュー */
.cnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.cnav a{text-decoration:none;color:var(--muted);font-weight:700;font-size:13px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 16px}
.cnav a:hover{color:var(--ink);border-color:var(--pink-soft)}
.cnav a[aria-current="page"]{color:#fff;background:linear-gradient(180deg,var(--pink),#C21E7E);border-color:var(--pink)}
.cnav .home{background:transparent;border-color:transparent;padding-left:4px}
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:8px}
.hub a{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-top:3px solid var(--c);border-radius:12px;padding:16px}
.hub a:hover{border-color:var(--pink-soft);border-top-color:var(--c)}
.hub b{font-size:18px;display:flex;gap:8px;align-items:center}
.hub span{color:var(--muted);font-size:13px}
.hub em{font-style:normal;font-family:var(--display);font-size:28px;color:var(--c)}
.movies,.episodes,.allep{margin-top:8px}

*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.goods{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:-6px 0 16px;display:grid;gap:8px}
.goods-h{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.pr{font-size:10px;font-weight:800;letter-spacing:.1em;border:1px solid var(--muted);color:var(--muted);border-radius:3px;padding:0 6px}
.goods-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.goods-list a{display:grid;gap:4px;text-decoration:none;color:var(--ink);font-size:11px;line-height:1.35;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px}
.goods-list a:hover{border-color:var(--pink)}
.goods-list img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:4px}
.goods-list span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.goods-list b{color:var(--gold)}
.credit{font-size:11px;color:var(--muted)}
.credit a{color:var(--muted)}
.mv{grid-template-columns:auto 52px 1fr}
.mvplay{width:96px;aspect-ratio:16/9;border:1px solid var(--line);border-radius:6px;overflow:hidden;padding:0;background:#000;position:relative}
.mvplay img{width:100%;height:100%;object-fit:cover;display:block}
.mvplay span{position:absolute;inset:auto 0 0 0;font-size:10px;font-weight:800;background:rgba(0,0,0,.65);color:#fff;padding:1px 0}
.mvplay:hover{border-color:var(--pink)}
.mv:not(:has(.mvplay)){grid-template-columns:52px 1fr}
#mvdlg{border:1px solid var(--line);border-radius:14px;background:#160C28;color:var(--ink);padding:12px;width:min(860px,calc(100% - 32px))}
#mvdlg::backdrop{background:rgba(5,2,12,.75)}
#mvdlg .mvbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-weight:700}
#mvdlg .mvclose{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.1);font-size:18px}
#mvdlg .mvframe{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
#mvdlg iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* 相関図の商品画像 (conan-extras.js) */
.goods-note{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
.with-goods .people{gap:10px}
.pw{display:grid;gap:4px;justify-items:stretch;width:112px;min-width:0}
.pw .p{width:100%}
.pimg{position:relative;display:grid;place-items:center;aspect-ratio:1;width:100%;border-radius:8px;overflow:hidden;background:#fff;border:1px solid rgba(255,255,255,.18);text-decoration:none}
.pimg img{width:100%;height:100%;object-fit:contain;display:block}
.pimg .kind{position:absolute;left:0;right:0;bottom:0;font-size:9px;font-weight:800;text-align:center;background:rgba(11,7,22,.72);color:#fff;padding:1px 0}
.pimg.none{background:rgba(255,255,255,.04);border-style:dashed}
a.pimg:hover{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.board.dim .pw:has(.p:not(.sel):not(.rel-on)) .pimg{opacity:.45}
.goods-one{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.goods-one > a:first-child{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;align-items:center;text-decoration:none;color:var(--ink);font-size:12px;max-width:520px}
.goods-one > a:first-child img{grid-row:span 2;width:72px;height:72px;object-fit:contain;background:#fff;border-radius:6px}
.goods-one b{color:var(--gold)}
.goods-one .more{color:var(--gold);font-weight:700;font-size:12px;text-decoration:none;border:1px solid rgba(255,178,30,.5);border-radius:999px;padding:4px 12px}
.none-msg{color:var(--muted);font-size:12px}
@media (max-width:860px){.pw{width:96px}}
/* 広告・アフィリエイト (monetize.js) */
.prnote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-8px 0 14px;font-size:12px;color:var(--muted)}
.prnote a{color:var(--pink-soft)}
.adbox{margin:16px 0;padding:8px;border:1px dashed rgba(255,255,255,.16);border-radius:10px;background:rgba(0,0,0,.25);min-height:100px}
.adlabel{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;margin-bottom:4px}
</style>
</head>

<script>
/* 勢力 (表示順 = 3列×3段の並び。中央が主人公たち) */
const GROUPS=[
  {id:"org",   name:"黒の組織",       c:"#9A9AB0"},
  {id:"koan",  name:"公安警察",       c:"#5FD3C6"},
  {id:"fbi",   name:"FBI・赤井家",    c:"#6FA8FF"},
  {id:"police",name:"警視庁",         c:"#7BD88F"},
  {id:"main",  name:"主人公と毛利家", c:"#FF8CCB", center:true},
  {id:"kudo",  name:"工藤家・阿笠邸", c:"#FFB21E"},
  {id:"school",name:"警察学校の同期",c:"#F7A8C8"},
  {id:"friends",name:"友人・西の探偵",c:"#F08A6C"},
  {id:"kid",   name:"怪盗キッド",     c:"#E6E6F0"},
  {id:"dt",    name:"少年探偵団",     c:"#FFD966"},
];
/* 勢力のマーク (このページ用のオリジナルの記号) */
const ICONS={
  main:'<circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M14.5 14.5 21 21" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>',
  kudo:'<path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z" fill="currentColor"/>',

  friends:'<circle cx="9" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="15" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/>',
  kid:'<path d="M7 3h10l4 6-9 12L3 9z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M9 3l3 18 3-18" fill="none" stroke="currentColor" stroke-width="1.4"/>',
  police:'<path d="m12 2 2.6 6.2 6.7.5-5.1 4.4 1.6 6.5L12 16.1l-5.8 3.5 1.6-6.5L2.7 8.7l6.7-.5z" fill="currentColor"/>',
  koan:'<path d="M12 2 20 5v6c0 5.2-3.4 9.4-8 11-4.6-1.6-8-5.8-8-11V5z" fill="currentColor"/>',

function center(el,box){const r=el.getBoundingClientRect();return {x:r.left-box.left+r.width/2,y:r.top-box.top+r.height/2,w:r.width,h:r.height}}
function edge(a,b){
  // 人物ボックスの縁から線を出す
  const dx=b.x-a.x,dy=b.y-a.y,t=Math.min(Math.abs(a.w/2/(dx||1e-6)),Math.abs(a.h/2/(dy||1e-6)));
  return {x:a.x+dx*Math.min(t,1),y:a.y+dy*Math.min(t,1)};
}
function draw(){
  const svg=$("#lines");if(!svg)return;svg.innerHTML="";
  if(matchMedia("(max-width:860px)").matches)return;
  const box=$("#board").getBoundingClientRect();
  svg.setAttribute("viewBox",`0 0 ${box.width} ${box.height}`);
  const links=st.all?visibleLinks():visibleLinks().filter(l=>l[0]===st.sel||l[1]===st.sel);
  const ns="http://www.w3.org/2000/svg";
  const labels=[];
  links.forEach(l=>{
    const ea=document.querySelector(`.p[data-id="${l[0]}"]`),eb=document.querySelector(`.p[data-id="${l[1]}"]`);
    if(!ea||!eb)return;
    const a=center(ea,box),b=center(eb,box),pa=edge(a,b),pb=edge(b,a);
    const mx=(pa.x+pb.x)/2,my=(pa.y+pb.y)/2,bend=Math.min(60,Math.hypot(pb.x-pa.x,pb.y-pa.y)*.12);
    const nx=-(pb.y-pa.y),ny=pb.x-pa.x,len=Math.hypot(nx,ny)||1,cx=mx+nx/len*bend,cy=my+ny/len*bend;
    const path=document.createElementNS(ns,"path");
    path.setAttribute("d",`M${pa.x},${pa.y} Q${cx},${cy} ${pb.x},${pb.y}`);
    path.setAttribute("class","lnk"+(l[3]?" sp":""));svg.append(path);
    // ラベルは曲線の頂点付近 (同じ場所に重なったら少しずらす)
    let lx=(pa.x+2*cx+pb.x)/4,ly=(pa.y+2*cy+pb.y)/4;
    while(labels.some(q=>Math.abs(q.x-lx)<70&&Math.abs(q.y-ly)<18))ly+=20;
    labels.push({x:lx,y:ly,text:l[2],sp:l[3]});
  });
  labels.forEach(q=>{
    const g=document.createElementNS(ns,"g");g.setAttribute("class","lbl"+(q.sp?" sp":""));
    const t=document.createElementNS(ns,"text");t.textContent=q.text;t.setAttribute("x",q.x);t.setAttribute("y",q.y+4);t.setAttribute("text-anchor","middle");
    g.append(t);svg.append(g);
    const bb=t.getBBox(),r=document.createElementNS(ns,"rect");
    r.setAttribute("x",bb.x-6);r.setAttribute("y",bb.y-2);r.setAttribute("width",bb.width+12);r.setAttribute("height",bb.height+4);r.setAttribute("rx",4);
    g.insertBefore(r,t);
  });
}

/* 全話リスト (episodes.json: [{no,t,d}]) */
(async()=>{
  if(!$("#aelist"))return;
  let ALL=[],cur=[],shown=0;const PAGE=120,keySet=new Set(EPISODES.filter(e=>e[4]).map(e=>e[0]));
  const f={q:"",year:"",key:false};
  try{ALL=await (await fetch("episodes.json")).json()}catch(e){$("#aecount").textContent="全話リストを読み込めませんでした。";return}
  const years=[...new Set(ALL.map(x=>x.d.slice(0,4)))].sort().reverse();
  years.forEach(y=>$("#aeyear").add(new Option(y+"年",y)));
  const last=ALL[ALL.length-1];
  $("#aecount").textContent=`第1話（1996年1月）から第${last.no}話（${last.d.slice(0,4)}年${+last.d.slice(5,7)}月）まで、全${ALL.length.toLocaleString()}話のサブタイトルと放送日です。`;
  function run(){
    const q=f.q.toLowerCase();
    cur=ALL.filter(x=>(!q||x.t.toLowerCase().includes(q))&&(!f.year||x.d.startsWith(f.year))&&(!f.key||keySet.has(x.no))).slice().reverse();
    shown=0;$("#aelist").innerHTML="";more();
  }
  function more(){
    $("#aelist").insertAdjacentHTML("beforeend",cur.slice(shown,shown+PAGE).map(x=>`<li class="ae${keySet.has(x.no)?" key":""}"><span class="no">第${x.no}話</span><span class="t">${keySet.has(x.no)?`<a href="${epHref(x.no)}">${esc(x.t)}</a>`:esc(x.t)}</span><span class="d">${fmtDate(x.d)}</span></li>`).join("")||'<li class="ae"><span></span><span class="t">該当する話がありません。</span></li>');
    shown+=PAGE;$("#aemore").hidden=shown>=cur.length;
  }
  $("#aemore").onclick=more;
  let tm;$("#aeq").oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{f.q=e.target.value.trim();run()},150)};
  $("#aeyear").onchange=e=>{f.year=e.target.value;run()};
  $("#aekey").onclick=e=>{f.key=!f.key;e.currentTarget.setAttribute("aria-pressed",f.key);run()};
  run();
})();
